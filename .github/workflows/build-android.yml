name: DUITKU Android Build

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'capacitor.config.*'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - 'debug'
          - 'release'
          - 'all'

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-mobile-configuration:
    name: Check Mobile Project Readiness
    runs-on: ubuntu-latest
    outputs:
      has_android: ${{ steps.detect.outputs.has_android }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Capacitor Android configuration
        id: detect
        run: |
          if [ -d "android" ] && ([ -f "capacitor.config.ts" ] || [ -f "capacitor.config.json" ]); then
            echo "has_android=true" >> $GITHUB_OUTPUT
            echo "Capacitor Android project detected."
          else
            echo "has_android=false" >> $GITHUB_OUTPUT
            echo "::notice title=Capacitor Android Not Initialized::Proyek DUITKU saat ini belum memiliki folder 'android/' atau 'capacitor.config.ts'. Untuk membangun APK/AAB, inisialisasikan Capacitor terlebih dahulu dengan panduan pada README.md."
          fi

  build-android:
    name: Build Android APK and AAB
    needs: check-mobile-configuration
    if: needs.check-mobile-configuration.outputs.has_android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web assets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: bun run build

      - name: Sync web assets to Capacitor Android
        run: bunx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        if: github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'all' || github.event_name == 'push'
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        if: github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'all' || github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: duitku-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Setup Release Keystore (if secret available)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Build Release APK and AAB
        if: env.ANDROID_KEYSTORE_BASE64 != '' && (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'all')
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Upload Release AAB & APK
        if: env.ANDROID_KEYSTORE_BASE64 != '' && (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'all')
        uses: actions/upload-artifact@v4
        with:
          name: duitku-release-bundle
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30
