name: DUITKU Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  create-release:
    name: Package and Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run validation checks
        run: |
          bun run lint
          bun run typecheck

      - name: Build production web bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: bun run build

      - name: Package web distribution zip
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [[ "$VERSION" == *"main"* ]]; then
            VERSION="${{ github.event.inputs.tag_name || 'v1.0.0' }}"
          fi
          mkdir -p release-assets
          cd dist && zip -r "../release-assets/duitku-web-${VERSION}.zip" ./* && cd ..
          echo "Web package created: release-assets/duitku-web-${VERSION}.zip"

      - name: Check for Android assets
        id: check_android
        run: |
          if [ -d "android/app/build/outputs" ]; then
            echo "has_android=true" >> $GITHUB_OUTPUT
            cp -r android/app/build/outputs/apk/debug/*.apk release-assets/ 2>/dev/null || true
            cp -r android/app/build/outputs/apk/release/*.apk release-assets/ 2>/dev/null || true
            cp -r android/app/build/outputs/bundle/release/*.aab release-assets/ 2>/dev/null || true
          else
            echo "has_android=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          name: DUITKU Release ${{ github.ref_name || github.event.inputs.tag_name }}
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 🚀 DUITKU Release

            Aplikasi manajemen keuangan pribadi full-stack dengan Supabase PostgreSQL & Supabase Auth.

            #### 📦 Paket Rilis:
            - **Web Distribution Bundle**: `duitku-web-${{ github.ref_name || github.event.inputs.tag_name }}.zip`
            - **Database**: Supabase PostgreSQL dengan Row Level Security (RLS)
            - **Runtime**: Vite + React 19 + TypeScript + Bun

            *Catatan: File APK/AAB akan otomatis dilampirkan jika proyek Android Capacitor telah diinisialisasi.*
