<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DUITKU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--sf:#fdf7ff;--cd:#fff;--ink:#2e2150;--mut:#8a86b8;--line:#ececf5;--gh:#e7e5f7;--ct:#f3eaff;--dk:#3a2a5c;--bar:#3a2a5c;--lime:#d3f75f;--c1:#9a98cf;--c2:#a9a6d8;--c3:#b9b5e0;--c4:#8c89c2;--in:#4d8a00;--neg:#e0618a;--h1:#9a98cf;--h2:#a9a6d8;--h3:#b9b5e0;--dk1:#3a2a5c;--dk2:#241445;--sh:0 4px 24px rgba(46,33,80,.05);--ez:cubic-bezier(.2,.8,.2,1);--sp:cubic-bezier(.34,1.45,.64,1)}
:root[data-theme="dark"]{--sf:#0e0b1e;--cd:#1a1536;--ink:#efeafc;--mut:#9d98cf;--line:#2a2450;--gh:#2a2450;--ct:#231d46;--dk:#4b3b80;--bar:#d3f75f;--c1:#2a2350;--c2:#4b4380;--c3:#3b3470;--c4:#3c3569;--in:#d3f75f;--h1:#3b3470;--h2:#4b4380;--h3:#5a52a0;--dk1:#261b52;--dk2:#160f34;--sh:0 4px 24px rgba(0,0,0,.25)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Urbanist,system-ui,sans-serif;background:var(--sf);color:var(--ink);-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
body:not(.li) .app{display:none}body.li #auth{display:none}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
/* sidebar */
.sb{position:sticky;top:0;height:100vh;padding:22px 16px;display:flex;flex-direction:column;gap:20px;background:var(--cd);border-right:1px solid var(--line);transition:background .4s}
.lg{display:flex;align-items:center;gap:12px;padding:4px 8px}
.lgm{width:42px;height:42px;border-radius:14px;background:var(--dk1);color:var(--lime);display:grid;place-items:center;box-shadow:0 10px 18px -6px rgba(58,42,92,.4)}
.lgt{font-weight:800;font-size:22px;letter-spacing:.4px}
.nv{position:relative;display:grid;gap:4px}
.nv button{position:relative;z-index:1;display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:16px;color:var(--mut);font-weight:600;font-size:15px;text-align:left;transition:color .3s,transform .3s var(--ez)}
.nv button:hover{color:var(--ink);transform:translateX(3px)}
.nv button.on{color:var(--ink);font-weight:700}
.ind{position:absolute;left:0;right:0;top:0;height:46px;border-radius:16px;background:var(--ct);z-index:0;transition:transform .55s var(--sp),height .3s}
.ind::before{content:"";position:absolute;left:0;top:26%;bottom:26%;width:4px;border-radius:4px;background:var(--bar)}
.sbf{margin-top:auto;display:grid;gap:10px}
.uc{display:flex;align-items:center;gap:12px;padding:12px;border-radius:20px;background:var(--gh);min-width:0}
.uc b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.uc small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uc>div:last-child{min-width:0}
.sbr{display:flex;gap:8px}
.sbr button{flex:1;height:42px;border-radius:14px;background:var(--gh);display:grid;place-items:center;transition:transform .3s var(--sp),background .3s}
.sbr button:hover{background:var(--ct);transform:translateY(-2px)}
.av{width:42px;height:42px;border-radius:50%;background:var(--lime) center/cover;color:#2e2150;display:grid;place-items:center;font-weight:800;flex:none}
.av.xl{width:96px;height:96px;font-size:32px;box-shadow:0 12px 24px -8px rgba(160,200,30,.7)}
/* main */
main{padding:30px clamp(18px,3vw,44px) 60px;max-width:1360px;width:100%;margin:0 auto;min-width:0}
.mt{display:none}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.ph h1{font-size:34px;line-height:1.1;margin:4px 0 0;font-weight:800;letter-spacing:-.3px}
.ph p{margin:6px 0 0;color:var(--mut);font-size:15px}
.kick{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:700}
.pr{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.live{display:inline-flex;gap:8px;align-items:center;background:var(--ct);padding:8px 14px;border-radius:99px;font-size:13px;font-weight:800}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 0 rgba(211,247,95,.8);animation:pl 2s infinite}
@keyframes pl{70%{box-shadow:0 0 0 9px rgba(211,247,95,0)}100%{box-shadow:0 0 0 0 rgba(211,247,95,0)}}
.card{background:var(--cd);border-radius:28px;padding:22px;box-shadow:var(--sh);transition:background .4s}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.ch h3{margin:0;font-size:18px;font-weight:700}
.ch span,.sub{color:var(--mut);font-size:13px;font-weight:600}
.link{color:var(--mut);font-weight:800;font-size:13px;transition:color .2s}.link:hover{color:var(--ink)}
.cap{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.85}.cap.sm{font-size:11px;opacity:.75}
.empty{color:var(--mut);padding:22px 0;text-align:center;font-weight:600}
.neg{color:var(--neg)}
/* buttons */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--dk);color:#fff;border-radius:99px;padding:13px 24px;font-weight:700;font-size:15px;transition:transform .35s var(--sp),box-shadow .3s,background .3s}
.btn.lime{background:var(--lime);color:#2e2150;box-shadow:0 10px 22px -8px rgba(150,190,20,.6)}
.btn.ghost{background:var(--gh);color:var(--ink)}
.btn.neg2{background:rgba(224,97,138,.14);color:var(--neg)}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 26px -10px rgba(30,15,70,.5)}
.btn:active,.chip:active,.seg button:active{transform:scale(.94);transition-duration:.08s}
.chip{position:relative;overflow:hidden;display:inline-flex;gap:7px;align-items:center;padding:9px 18px;border-radius:99px;background:var(--gh);color:var(--ink);font-weight:600;font-size:14px;white-space:nowrap;transition:transform .3s var(--sp),background .3s,color .3s}
.chip:hover{transform:translateY(-2px)}
.chip.on{background:var(--dk);color:#fff}
.chip .n{background:var(--lime);color:#2e2150;border-radius:99px;font-size:12px;padding:1px 8px;font-weight:800}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.sc{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.seg{position:relative;display:inline-flex;background:var(--gh);border-radius:99px;padding:4px}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n));border-radius:99px;background:var(--cd);box-shadow:0 4px 12px rgba(46,33,80,.12);transform:translateX(calc(var(--p)*100%));transition:transform .5s var(--sp)}
.seg button{position:relative;z-index:1;flex:1;padding:10px 22px;border-radius:99px;font-weight:700;font-size:14px;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:7px;transition:color .3s,transform .2s}
.seg button.on{color:var(--ink)}
.seg.full{display:flex;width:100%}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:30px;padding:26px;color:#fff;background:linear-gradient(135deg,var(--h1),var(--h2) 55%,var(--h3));box-shadow:0 24px 44px -18px rgba(58,42,92,.45)}
.hero.dk{background:linear-gradient(145deg,var(--dk1),var(--dk2))}
.glow{position:absolute;border-radius:50%;filter:blur(36px);pointer-events:none}
.g1{right:-50px;top:-50px;width:190px;height:190px;background:rgba(211,247,95,.25)}.g2{left:-40px;bottom:-50px;width:170px;height:170px;background:rgba(58,42,92,.3)}
.hero>*:not(.glow){position:relative}
.hrow{display:flex;justify-content:space-between;align-items:center}
.eye{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;color:#fff;transition:transform .3s var(--sp),background .3s}.eye:hover{background:rgba(255,255,255,.28);transform:scale(1.08)}
.big{font-size:clamp(34px,4vw,48px);font-weight:800;letter-spacing:-.5px;margin:8px 0 22px;line-height:1.05}
.hfoot{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-top:1px solid rgba(255,255,255,.25);padding-top:18px;flex-wrap:wrap}
.hv{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:800;margin-top:4px}
.hv .i{background:rgba(255,255,255,.18);border-radius:50%;padding:4px;width:26px;height:26px;color:var(--neg)}
.spark{display:flex;gap:6px;align-items:flex-end;height:48px;flex:1;max-width:160px;min-width:90px}
.spark i{flex:1;height:var(--h);background:rgba(255,255,255,.42);border-radius:6px;transform-origin:bottom}
.spark i.t{background:var(--lime)}
.enter .spark i{animation:grow .9s var(--ez) both}
@keyframes grow{from{transform:scaleY(0)}}
.hbtns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill-g{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;background:rgba(211,247,95,.2);color:var(--lime);font-size:13px;font-weight:800}
.hero .btn.ghost{background:rgba(255,255,255,.14);color:#fff}
/* grids */
.dash{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:grid;gap:20px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mini{display:flex;align-items:center;gap:12px;padding:16px;border-radius:24px;background:var(--cd);box-shadow:var(--sh);min-width:0;transition:transform .35s var(--ez)}
.mini:hover{transform:translateY(-3px)}
.mini .mi{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.mini small{display:block;color:var(--mut);font-size:12px;font-weight:600}.mini b{display:block;font-size:16px;white-space:nowrap}
.mi.in{background:rgba(211,247,95,.4);color:#4d8a00}.mi.out{background:rgba(224,97,138,.14);color:var(--neg)}.mi.pe{background:var(--ct);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.tw{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
/* rows */
.row{display:grid;grid-template-columns:46px minmax(0,1fr) auto 34px;gap:14px;align-items:center;padding:12px 8px;border-radius:18px;transition:background .25s,transform .35s var(--ez)}
.row.nd{grid-template-columns:46px minmax(0,1fr) auto}
.row:hover{background:var(--ct);transform:translateX(3px)}
.ico{width:46px;height:46px;border-radius:50%;background:var(--ct);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.ico.in{background:var(--lime);color:#2e2150;box-shadow:0 6px 14px -6px rgba(150,190,20,.7)}
.ico.neg{background:rgba(224,97,138,.15);color:var(--neg)}
.ico.gr{background:rgba(77,138,0,.15);color:var(--in)}
.rm b{font-size:15px}.rm small{display:block;color:var(--mut);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:800;font-size:15px;text-align:right;white-space:nowrap}.amt.in{color:var(--in)}.amt.out{color:var(--neg)}.amt small{display:block;color:var(--in);font-size:12px;font-weight:700}
.bdg{font-style:normal;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--gh);color:var(--ink);margin-left:8px;vertical-align:middle;white-space:nowrap}
.bdg.lm{background:var(--lime);color:#2e2150}.bdg.rd{background:rgba(224,97,138,.15);color:var(--neg)}
.del{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--mut);opacity:0;transition:opacity .25s,background .25s,color .25s}
.row:hover .del{opacity:1}.del:hover{background:rgba(224,97,138,.15);color:var(--neg)}
@media (hover:none){.del{opacity:1}}
.dg{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--mut);padding:16px 8px 6px;display:flex;align-items:center}
.dg:first-child{padding-top:4px}
.chk{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;padding:14px;border-radius:20px;background:var(--gh);margin-bottom:8px;transition:transform .3s var(--ez),background .3s}
.chk:hover{transform:translateX(4px)}
.chk .o{width:22px;height:22px;border-radius:50%;border:2px solid var(--mut);display:grid;place-items:center;transition:background .3s,border-color .3s;color:#2e2150}
.chk .o .i{width:14px;height:14px;stroke-width:3}
.chk b{display:block;font-size:15px}.chk small{display:block;color:var(--mut);font-size:12px;margin-top:2px}.chk .ca{font-weight:800;font-size:15px}
.chk.d{opacity:.78;background:var(--ct)}.chk.d .o{background:var(--lime);border-color:var(--lime)}.chk.d b,.chk.d .ca{text-decoration:line-through;color:var(--mut)}.chk.d small{color:var(--in);font-weight:700}
.chk.pop .o{animation:pop .5s var(--sp)}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
.dbt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-radius:22px;background:var(--ct);margin-bottom:10px}
.dbt .l{display:flex;gap:12px;align-items:center;min-width:0}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;text-align:center}
.cal i{font-style:normal;font-size:12px;color:var(--mut);font-weight:700;padding-bottom:8px}
.cal b{height:36px}
.cd{position:relative;isolation:isolate;height:36px;font-weight:600;font-size:14px}
.cd.rg{background:var(--ct)}.cd.rs{border-radius:99px 0 0 99px}.cd.re{border-radius:0 99px 99px 0}
.cd:not(.rg):hover{color:var(--mut)}
.cd.td{color:#2e2150;font-weight:800}
.cd.td::before{content:"";position:absolute;inset:0;margin:auto;width:32px;height:32px;border-radius:50%;background:var(--lime);box-shadow:0 4px 12px rgba(150,190,20,.6);z-index:-1}
.cd.sel:not(.td)::after{content:"";position:absolute;inset:0;margin:auto;width:32px;height:32px;border-radius:50%;border:2px solid var(--bar);z-index:-1;animation:pop .4s var(--sp)}
.cd u{position:absolute;bottom:1px;left:50%;width:4px;height:4px;border-radius:50%;background:var(--mut);transform:translateX(-50%)}
/* forms */
.fld{display:grid;gap:8px;font-size:13px;font-weight:700;color:var(--mut)}
.fld input,.fld select{border:0;border-radius:18px;background:var(--gh);padding:15px 18px;font-size:15px;color:var(--ink);font-weight:600;outline:0;width:100%;transition:box-shadow .25s,background .25s}
.fld input:focus,.fld select:focus{box-shadow:0 0 0 3px var(--lime);background:var(--cd)}
.fld input[readonly]{opacity:.6;cursor:not-allowed}
.fld input::placeholder{color:var(--mut);opacity:.6;font-weight:500}
.fm{display:grid;gap:20px}
.ab{background:var(--ct);border-radius:24px;padding:18px 22px;display:grid;gap:6px}
.ab .t{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--mut)}
.ab .r{display:flex;align-items:baseline;gap:10px}.ab .r span{font-size:22px;font-weight:800;color:var(--mut)}
.fld.ab input,.ab input{background:none;box-shadow:none;padding:0;border-radius:0;font-size:40px;font-weight:800;letter-spacing:-.5px;color:var(--ink);border:0;outline:0;width:100%}
.ab input:focus{box-shadow:none;background:none}
.dsc{position:relative}.dsc input{padding-left:50px}.dsc .i{position:absolute;left:17px;top:50%;margin-top:-10px;color:var(--mut);pointer-events:none}
.wos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.wo{display:grid;grid-template-columns:40px minmax(0,1fr) 20px;gap:12px;align-items:center;text-align:left;padding:12px;border-radius:20px;background:var(--gh);border:2px solid transparent;transition:border-color .3s,background .3s,transform .3s var(--sp)}
.wo:hover{transform:translateY(-2px)}
.wo.on{border-color:var(--bar);background:var(--ct)}
.wo b{display:block;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wo small{display:block;color:var(--mut);font-size:12px;font-weight:600}
.wi2{width:40px;height:40px;border-radius:13px;background:var(--dk);color:#fff;display:grid;place-items:center}
.wo .ck{width:20px;height:20px;border-radius:50%;background:var(--lime);color:#2e2150;display:grid;place-items:center;transform:scale(0);transition:transform .4s var(--sp)}
.wo .ck .i{width:12px;height:12px;stroke-width:3.2}.wo.on .ck{transform:scale(1)}
.rc{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-radius:20px;background:var(--ct)}
.rc .l{display:flex;gap:12px;align-items:center;font-size:14px;font-weight:700}.rc small{display:block;color:var(--mut);font-weight:600;font-size:12px}
.circ{width:42px;height:42px;border-radius:50%;background:var(--cd);display:grid;place-items:center;box-shadow:var(--sh);transition:transform .3s var(--sp)}.circ:hover{transform:scale(1.1)}
.prev{position:sticky;top:24px;display:grid;gap:16px;background:linear-gradient(150deg,var(--dk1),var(--dk2));color:#fff}
.pvh{display:flex;justify-content:space-between;align-items:center}.prev .bdg{margin:0}
.pva{font-size:40px;font-weight:800;letter-spacing:-.5px;line-height:1}.pva.out{color:#fff}.pva.in{color:var(--lime)}
.pvt{font-size:17px;font-weight:700;opacity:.95}
.pvm{display:grid;gap:10px;font-size:14px;font-weight:600}.pvm span{display:flex;gap:10px;align-items:center;opacity:.85}
.pvb{border-top:1px solid rgba(255,255,255,.2);padding-top:14px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px;opacity:.95}.pvb b{font-size:18px}.pvb b.neg{color:var(--neg)}
/* wallets */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.wc{position:relative;overflow:hidden;border-radius:30px;padding:22px;color:#fff;display:grid;gap:30px;box-shadow:0 14px 28px -12px rgba(58,42,92,.35);transition:transform .45s var(--ez),box-shadow .4s}
.wc:hover{transform:translateY(-6px);box-shadow:0 24px 36px -16px rgba(58,42,92,.5)}
.wc::after{content:"";position:absolute;right:-40px;bottom:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.14);filter:blur(14px)}
.wc.c1{background:var(--c4)}.wc.c2{background:var(--c2)}.wc.lm{background:var(--lime);color:#2e2150}
.wt{display:flex;gap:12px;align-items:flex-start;position:relative;z-index:1}
.wt>div:nth-child(2){flex:1;min-width:0}
.wi{width:46px;height:46px;border-radius:16px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}.wc.lm .wi{background:var(--dk1);color:var(--lime)}
.wn{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.wn b{font-size:18px}.wn .bdg{margin:0;background:rgba(255,255,255,.22);color:inherit}.wc.lm .wn .bdg{background:rgba(58,42,92,.15)}
.wt small{display:block;opacity:.8;font-size:13px;margin-top:2px}
.pri{font-style:normal;font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--dk1);color:var(--lime)}
.mb2{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;color:inherit;transition:transform .3s var(--sp)}.mb2:hover{transform:scale(1.12)}.wc.lm .mb2{background:rgba(58,42,92,.12)}
.wb{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;position:relative;z-index:1;flex-wrap:wrap}
.wv{font-size:28px;font-weight:800;letter-spacing:-.3px;margin-top:2px}
.wbtn{background:#fff;color:#2e2150;padding:10px 16px;font-size:14px}.wc.lm .wbtn{background:var(--dk1);color:#fff}

<div class="card rv"><div class="ch"><h3>Preferensi Aplikasi</h3></div>${r.map(([k,t,s,i])=>`<div class="tg"><div><span class="mi">${ic(i)}</span><div><b>${t}</b><small>${s}</small></div></div><button class="sw ${S.set[k]?'on':''}" role="switch" aria-checked="${!!S.set[k]}" data-a="set" data-v="${k}" aria-label="${t}"></button></div>`).join('')}<div class="lang"><div>Bahasa antarmuka<small>Bahasa sistem aplikasi</small></div><span class="chip on">Indonesia (ID)</span></div><button class="lo" data-a="out">${ic('out')}Keluar dari akun</button><div class="ver">DUITKU Web v2.4.0</div></div></div>`}};
/* engine */
const cnt=el=>{const to=+el.dataset.n;if(matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=rp(to);return}const t0=performance.now(),f=t=>{const k=Math.min(1,(t-t0)/900),e=1-Math.pow(1-k,4);el.textContent=rp(to*e);if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)};
const count=()=>document.querySelectorAll('[data-n]').forEach(cnt);
function navState(p){const nv=$('#nv');nv.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===p));const a=nv.querySelector('button.on'),ind=nv.querySelector('.ind');if(a&&ind){ind.style.height=a.offsetHeight+'px';ind.style.transform=`translateY(${a.offsetTop}px)`}const mo=['utang','laporan','kategori','pengaturan'].includes(p);document.querySelectorAll('#bn>button').forEach(b=>b.classList.toggle('on',b.dataset.v===p||(b.dataset.v==='more'&&mo)))}
function draw(p,anim){const vw=$('#view'),y=scrollY;vw.classList.remove('leave','enter');vw.innerHTML=V[p]();vw.querySelectorAll('.rv').forEach((e,i)=>{if(!e.style.getPropertyValue('--i'))e.style.setProperty('--i',Math.min(i,14))});if(anim){void vw.offsetWidth;vw.classList.add('enter');scrollTo({top:0,behavior:'instant'});count()}else{vw.classList.add('enter');scrollTo({top:y,behavior:'instant'})}navState(p);hdr();persist()}
const soft=()=>draw(S.cur,false);
function route(){if(!S.user)return;let p=(location.hash||'#dashboard').slice(1);if(!V[p])p='dashboard';const vw=$('#view');if(S.cur&&S.cur!==p){vw.classList.remove('enter');vw.classList.add('leave');clearTimeout(S.tm);S.tm=setTimeout(()=>{S.cur=p;draw(p,true)},170)}else{S.cur=p;draw(p,true)}}
function hdr(){const m=S.me;if(!m)return;[$('#sav'),$('#mav')].forEach(h=>{h.style.backgroundImage=m.avatar?`url(${m.avatar})`:'';h.textContent=m.avatar?'':ini(m.name)});$('#sun').textContent=m.name;$('#sue').textContent=m.email;$('#thb').innerHTML=ic(S.theme==='dark'?'sun':'moon')}
function persist(){if(!S.user)return;const{wallets,tx,bills,debts,cats,set,hist}=S;ST.s('dk_d_'+S.user,{wallets,tx,bills,debts,cats,set,hist})}
function toast(m){document.querySelectorAll('.toast').forEach(e=>e.remove());const e=document.createElement('div');e.className='toast';e.innerHTML=ic('check')+esc(m);document.body.appendChild(e);setTimeout(()=>e.remove(),2300)}
function modal(h){let m=$('#md');if(!h){if(m){m.classList.add('out');setTimeout(()=>m.remove(),200)}return}if(m)m.remove();m=document.createElement('div');m.id='md';m.className='md';m.innerHTML=`<div class="mb" role="dialog" aria-modal="true">${h}</div>`;document.body.appendChild(m);const i=m.querySelector('input');if(i&&matchMedia('(pointer:fine)').matches)i.focus()}
const pop=(n,v)=>{const e=document.querySelector(`[data-a="${n}"][data-v="${v}"]`);if(e)e.classList.add('pop')};
const fmtDue=iso=>{if(!iso)return '-';const d=new Date(iso+'T00:00');return d.getDate()+' '+MON[d.getMonth()]};
const wopt=()=>S.wallets.map(w=>`<option value="${w.id}">${esc(w.n)} (${rp(bal(w))})</option>`).join('');
/* actions */
const A={
go:v=>{modal();if(location.hash==='#'+v)route();else location.hash=v},
period:(v,el)=>{S.period=v;const sg=el.parentElement;sg.style.setProperty('--p',['Harian','Mingguan','Bulanan'].indexOf(v));sg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));$('#perl').textContent=perLbl();const e=$('#per');e.dataset.n=perVal();if(S.hide)e.textContent='Rp ••••••';else cnt(e)},
hide:()=>{S.hide=!S.hide;soft()},
day:v=>{S.day=+v;$('#calc').innerHTML=calHTML();$('#agd').innerHTML=agendaHTML()},
bill:v=>{S.bills[v].x^=1;soft();pop('bill',v)},debt:v=>{S.debts[v].x^=1;soft();pop('debt',v)},
q:v=>{S.q=v;$('#fch').innerHTML=txChips();$('#txl').innerHTML=txl()},
del:v=>{S.tx=S.tx.filter(t=>String(t.id)!==String(v));soft();toast('Transaksi dihapus')},
fk:(v,el)=>{S.f.k=v;S.f.c=S.cats.find(c=>c.k===v).n;const sg=$('#ks');sg.style.setProperty('--p',v==='in'?1:0);sg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));const ki=$('#ki');ki.textContent=v==='in'?'Masuk (+)':'Keluar (-)';ki.className='bdg '+(v==='in'?'lm':'rd');$('#cats').innerHTML=catChips();$('#wl').textContent=v==='in'?'Masuk ke dompet / rekening':'Bayar dari dompet / rekening';$('#pv').innerHTML=prevHTML()},
fc:v=>{S.f.c=v;$('#cats').innerHTML=catChips();$('#pv').innerHTML=prevHTML()},
fw:v=>{S.f.w=v;$('#wos').innerHTML=walOpts();$('#pv').innerHTML=prevHTML()},
rec:()=>$('#rf').click(),
save:()=>{const f=S.f,a=num(f.a);if(!a)return toast('Isi nominal transaksi dulu');const dt=new Date(f.d+'T00:00');if(isNaN(dt)||dt.getMonth()!==10||dt.getFullYear()!==2026)return toast('Pilih tanggal di November 2026');const d=dt.getDate(),n=new Date();S.tx.push({id:Date.now(),d,h:String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'),t:f.t.trim()||f.c,c:f.c,w:f.w,a,k:f.k,r:f.r});S.f.a='';S.f.t='';S.f.r='';toast(d>TODAY?'Transaksi terjadwal disimpan':'Transaksi disimpan');location.hash='transaksi'},
inc:v=>{S.f.k='in';S.f.c=S.cats.find(c=>c.k==='in').n;S.f.w=v;if(location.hash==='#tambah')draw('tambah',false);else location.hash='tambah'},
wf:v=>{S.wf=v;$('#wfc').innerHTML=wChips();$('#wg').innerHTML=wCards()},
trf:()=>modal(`<h3>Transfer antar akun</h3><label class="fld">Dari<select id="tf">${wopt()}</select></label><label class="fld">Ke<select id="tt">${S.wallets.map((w,i)=>`<option value="${w.id}" ${i===1?'selected':''}>${esc(w.n)}</option>`).join('')}</select></label><label class="fld">Nominal<input id="ta" inputmode="numeric" placeholder="Rp 0"></label><p class="er" id="er"></p><div class="mact"><button class="chip" data-a="mc">Batal</button><button class="btn lime" data-a="trfgo">Transfer</button></div>`),
trfgo:()=>{const f=S.wallets.find(w=>w.id===val('tf')),t=S.wallets.find(w=>w.id===val('tt')),a=num(val('ta'));if(f===t)return aerr('Pilih dua akun yang berbeda.');if(!a)return aerr('Isi nominal transfer.');if(a>bal(f))return aerr('Saldo akun asal tidak cukup.');f.b-=a;t.b+=a;modal();soft();toast('Transfer berhasil')},
addw:()=>modal(`<h3>Tambah dompet</h3><label class="fld">Bank atau dompet<select id="wb">${BANKS.map(([n])=>`<option>${n}</option>`).join('')}</select></label><label class="fld">Nama tampilan (opsional)<input id="wn" maxlength="30" placeholder="Contoh: BNI gaji"></label><label class="fld">Saldo awal<input id="wa" inputmode="numeric" placeholder="Rp 0"></label><div class="mact"><button class="chip" data-a="mc">Batal</button><button class="btn lime" data-a="sw">Simpan dompet</button></div>`),
sw:()=>{const b=BANKS.find(x=>x[0]===val('wb')),n=val('wn').trim()||b[0];S.wallets.push({id:'w'+Date.now(),n,t:b[1],m:b[1]==='Bank'?'•••• '+Math.floor(1000+Math.random()*9000):b[1]==='E-Wallet'?'Dompet digital':'Uang saku',b:num(val('wa'))});modal();soft();toast('Dompet ditambahkan')},
wmenu:v=>{const w=S.wallets.find(x=>x.id===v);modal(`<h3>${esc(w.n)}</h3><p class="sub">Saldo ${rp(bal(w))}</p><div class="stk"><button class="btn" data-a="wprio" data-v="${v}">Jadikan prioritas</button><button class="btn neg2" data-a="wdel" data-v="${v}">Hapus dompet</button><button class="chip" data-a="mc" style="justify-content:center">Batal</button></div>`)},
wprio:v=>{S.wallets.forEach(w=>w.l=w.id===v?1:0);modal();soft();toast('Dompet prioritas diubah')},
wdel:v=>{if(S.tx.some(t=>t.w===v)){modal();return toast('Dompet masih punya riwayat transaksi')}if(S.wallets.length<=1){modal();return toast('Minimal ada satu dompet')}S.wallets=S.wallets.filter(w=>w.id!==v);modal();soft();toast('Dompet dihapus')},
adebt:()=>modal(`<h3>Catat utang atau piutang</h3><div class="seg full" id="dk" style="--n:2;--p:0"><i></i><button class="on" data-a="dkk" data-v="utang">Utang saya</button><button data-a="dkk" data-v="piutang">Piutang</button></div><label class="fld">Nama orang<input id="dp" maxlength="30" placeholder="Contoh: Bayu"></label><label class="fld">Keterangan<input id="dn" maxlength="40" placeholder="Contoh: Pinjam makan malam"></label><label class="fld">Nominal<input id="da" inputmode="numeric" placeholder="Rp 0"></label><label class="fld">Jatuh tempo<input id="dd" type="date"></label><p class="er" id="er"></p><div class="mact"><button class="chip" data-a="mc">Batal</button><button class="btn lime" data-a="dsave">Simpan</button></div>`),
dkk:(v,el)=>{const sg=$('#dk');sg.dataset.k=v;sg.style.setProperty('--p',v==='piutang'?1:0);sg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el))},
dsave:()=>{const p=val('dp').trim(),a=num(val('da'));if(!p)return aerr('Isi nama orang.');if(!a)return aerr('Isi nominal.');S.debts.push({p,n:val('dn').trim()||'Tanpa keterangan',a,k:$('#dk').dataset.k||'utang',due:fmtDue(val('dd')),x:0});modal();soft();toast('Catatan ditambahkan')},
ck:(v,el)=>{S.ck=v;const sg=el.parentElement;sg.style.setProperty('--p',v==='in'?1:0);sg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));$('#kg').innerHTML=kCards()},
ecat:v=>{const c=S.cats.find(x=>x.n===v&&x.k===S.ck);modal(`<h3>${esc(c.n)}</h3><p class="sub">${c.k==='out'?'Atur batas anggaran bulanan':'Kategori pemasukan'}</p>${c.k==='out'?`<label class="fld">Anggaran bulanan<input id="kb" inputmode="numeric" value="${c.bud?c.bud.toLocaleString('id-ID'):''}" placeholder="Rp 0"></label>`:''}<div class="mact"><button class="chip" data-a="mc">Tutup</button>${S.tx.some(t=>t.c===c.n)?'':`<button class="btn neg2" data-a="cdel" data-v="${esc(c.n)}">Hapus</button>`}${c.k==='out'?`<button class="btn lime" data-a="cbud" data-v="${esc(c.n)}">Simpan</button>`:''}</div>`)},
cbud:v=>{const c=S.cats.find(x=>x.n===v&&x.k==='out');c.bud=num(val('kb'))||undefined;modal();soft();toast('Anggaran disimpan')},
cdel:v=>{S.cats=S.cats.filter(c=>!(c.n===v&&c.k===S.ck));modal();soft();toast('Kategori dihapus')},
acat:()=>modal(`<h3>Tambah kategori</h3><label class="fld">Nama kategori<input id="cn" maxlength="20" placeholder="Contoh: Kesehatan"></label>${S.ck==='out'?`<label class="fld">Anggaran bulanan (opsional)<input id="kb" inputmode="numeric" placeholder="Rp 0"></label>`:''}<p class="er" id="er"></p><div class="mact"><button class="chip" data-a="mc">Batal</button><button class="btn lime" data-a="csave">Simpan</button></div>`),
csave:()=>{const n=val('cn').trim();if(!n)return aerr('Isi nama kategori.');if(S.cats.some(c=>c.n.toLowerCase()===n.toLowerCase()&&c.k===S.ck))return aerr('Kategori sudah ada.');S.cats.push({n,k:S.ck,bud:S.ck==='out'?num(val('kb'))||undefined:undefined});modal();soft();toast('Kategori ditambahkan')},
set:(v,el)=>{S.set[v]^=1;el.classList.toggle('on');el.setAttribute('aria-checked',!!S.set[v])},
pick:()=>$('#pf').click(),
rpf:()=>{setAv(null);toast('Foto profil dihapus')},
sp:()=>{const n=val('pn').trim();if(!n)return toast('Nama tidak boleh kosong');const us=ST.g('dk_u')||{};us[S.user].name=n;ST.s('dk_u',us);S.me.name=n;hdr();const b=$('#spb');b.innerHTML=ic('check')+'Tersimpan rapi';setTimeout(()=>{if($('#spb'))$('#spb').innerHTML=ic('check')+'Simpan profil'},1600)},
theme:()=>{S.theme=S.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=S.theme;ST.s('dk_t',S.theme);$('#thb').innerHTML=ic(S.theme==='dark'?'sun':'moon');const t=$('#tm');if(t)t.innerHTML=ic(S.theme==='dark'?'sun':'moon')+(S.theme==='dark'?'Tema terang':'Tema gelap')},
more:()=>modal(`<h3>Menu lainnya</h3><div class="stk">${P.filter(x=>['utang','laporan','kategori','pengaturan'].includes(x[0])).map(([k,n,i])=>`<button class="mrow" data-a="go" data-v="${k}">${ic(i)}${n}</button>`).join('')}<button class="mrow" id="tm" data-a="theme">${ic(S.theme==='dark'?'sun':'moon')}${S.theme==='dark'?'Tema terang':'Tema gelap'}</button><button class="mrow neg" data-a="out">${ic('out')}Keluar</button></div>`),
mc:()=>modal(),
am:v=>{S.am=v;af()},
log:async()=>{const e=val('ae').trim().toLowerCase(),p=val('ap'),u=(ST.g('dk_u')||{})[e];if(!isE(e)||!p)return aerr('Isi email dan kata sandi.');if(!u||!u.h||u.h!==await hx(p+'|'+e))return aerr('Email atau kata sandi tidak cocok. Belum punya akun? Pilih Daftar.');start(e)},
reg:async()=>{const n=val('an').trim(),e=val('ae').trim().toLowerCase(),p=val('ap'),us=ST.g('dk_u')||{};if(!n)return aerr('Isi nama lengkap.');if(!isE(e))return aerr('Format email belum benar.');if(p.length<6)return aerr('Kata sandi minimal 6 karakter.');if(us[e])return aerr('Email ini sudah terdaftar. Silakan masuk.');us[e]={name:n,h:await hx(p+'|'+e)};ST.s('dk_u',us);start(e)},
out:()=>{modal();persist();ST.s('dk_s',null);S.user=null;S.me=null;S.cur=null;S.am='login';location.hash='';document.body.classList.remove('li');af();toast('Kamu sudah keluar')}};
const BANKS=[['BNI','Bank'],['BCA','Bank'],['Mandiri','Bank'],['BRI','Bank'],['CIMB Niaga','Bank'],['Bank Jago','Bank'],['SeaBank','Bank'],['GoPay','E-Wallet'],['OVO','E-Wallet'],['DANA','E-Wallet'],['Tunai','Tunai']];
const aerr=m=>{const e=$('#er');if(e)e.textContent=m};
const isE=s=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
const hx=async s=>{try{return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(unescape(encodeURIComponent(s)))}};
const setAv=a=>{const us=ST.g('dk_u')||{};us[S.user].avatar=a;ST.s('dk_u',us);S.me.avatar=a;soft();hdr()};
function af(){const d=S.am==='daftar',I=(l,id,t,ac)=>`<label class="fld">${l}<input id="${id}" type="${t}" autocomplete="${ac}"></label>`;$('#af').innerHTML=`<h2>${d?'Buat akun DUITKU':'Masuk ke DUITKU'}</h2><div class="chips"><button class="chip ${d?'':'on'}" data-a="am" data-v="login">Masuk</button><button class="chip ${d?'on':''}" data-a="am" data-v="daftar">Daftar</button></div><div class="fm" style="gap:14px">${d?I('Nama lengkap','an','text','name'):''}${I('Email','ae','email','email')}${I('Kata sandi','ap','password',d?'new-password':'current-password')}</div><p class="er" id="er"></p><button class="btn lime" data-main data-a="${d?'reg':'log'}" style="padding:16px">${d?'Daftar sekarang':'Masuk'}</button>${d?'':`<p class="mu">Coba akun demo: demo@duitku.id, kata sandi demo1234</p>`}`}
function build(){$('#nv').innerHTML='<span class="ind"></span>'+P.map(([k,n,i])=>`<button data-a="go" data-v="${k}">${ic(i)}<span>${n}</span></button>`).join('');$('#bn').innerHTML=`<button data-a="go" data-v="dashboard">${ic('home')}<span>Home</span></button><button data-a="go" data-v="transaksi">${ic('list')}<span>Transaksi</span></button><div class="fab"><button data-a="go" data-v="tambah" aria-label="Catat transaksi">${ic('plus')}</button><span>Catat</span></div><button data-a="go" data-v="dompet">${ic('wallet')}<span>Dompet</span></button><button data-a="more" data-v="more">${ic('gear')}<span>Lainnya</span></button>`;$('#lgm').innerHTML=$('#lgm2').innerHTML=ic('wallet');$('#lob').innerHTML=ic('out')}
function start(e,silent){ST.s('dk_s',e);S.user=e;const u=(ST.g('dk_u')||{})[e];S.me={name:u.name,email:e,avatar:u.avatar||null};Object.assign(S,clone(ST.g('dk_d_'+e)||(e===DE?DEMO:fresh())));S.tx.forEach((t,i)=>{t.id=t.id||i+1});S.cur=null;S.day=TODAY;S.f={k:'out',c:'Makan',w:S.wallets.some(w=>w.id==='bca')?'bca':S.wallets[0].id,t:'',a:'',d:'2026-11-12',r:''};document.body.classList.add('li');build();if(!silent){location.hash='dashboard';toast('Halo, '+u.name.split(' ')[0])}route()}
/* events */
document.addEventListener('click',e=>{const b=e.target.closest('.btn,.chip,.seg button');if(b&&e.detail){const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)*2,x=document.createElement('span');x.className='rp';x.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;b.appendChild(x);setTimeout(()=>x.remove(),600)}
if(e.target.id==='md')return modal();const a=e.target.closest('[data-a]');if(a&&A[a.dataset.a])A[a.dataset.a](a.dataset.v,a)});
document.addEventListener('input',e=>{const t=e.target,id=t.id;if(['fa','ta','wa','da','kb'].includes(id)){const n=num(t.value);t.value=n?n.toLocaleString('id-ID'):''}
if(id==='fa'||id==='ft'){S.f.a=val('fa');S.f.t=val('ft');$('#pv').innerHTML=prevHTML()}
if(id==='fd'){S.f.d=t.value;$('#pv').innerHTML=prevHTML()}
if(id==='sq'){S.sq=t.value;$('#txl').innerHTML=txl()}
if(id==='pn')$('#cc').textContent=t.value.length+' / 40'});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='pf'&&t.files[0]){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=256;const m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,256,256);setAv(c.toDataURL('image/jpeg',.88));toast('Foto profil diperbarui')};im.src=r.result};r.readAsDataURL(t.files[0]);t.value=''}
if(t.id==='rf'&&t.files[0]){if(t.files[0].size>5*1024*1024){toast('Ukuran struk maksimal 5 MB')}else{S.f.r=t.files[0].name;const n=$('#rn');if(n)n.textContent=S.f.r}t.value=''}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')modal();if(e.key==='Enter'&&e.target.closest('#auth')){const b=document.querySelector('#auth [data-main]');b&&b.click()}if(e.key==='Enter'&&e.target.getAttribute&&e.target.getAttribute('role')==='button')e.target.click()});
addEventListener('hashchange',route);
addEventListener('resize',()=>S.cur&&navState(S.cur));
(async()=>{const th=ST.g('dk_t')||'light';S.theme=th;document.documentElement.dataset.theme=th;const us=ST.g('dk_u')||{};if(!us[DE]){us[DE]={name:'Rina Anggraini',h:await hx('demo1234|'+DE)};ST.s('dk_u',us)}af();const e=ST.g('dk_s');if(e&&us[e])start(e,1)})();
</script>
